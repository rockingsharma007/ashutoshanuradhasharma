title: Ashutosh Anuradha Sharma
tagline: Notes from the Lab, the Market & the Studio
description: >-
  A personal blog exploring ideas across the Lab, the Market and the Studio —
  written by Ashutosh Anuradha Sharma.
author: Ashutosh Anuradha Sharma

# GitHub repo this site is committed to (used by the in-site editor at /admin/).
repository: rockingsharma007/ashutoshanuradhasharma
branch: main

# This is a project site, so it is served from a subpath.
# If you later rename the repo to <username>.github.io, set baseurl to "".
url: "https://rockingsharma007.github.io"
baseurl: "/ashutoshanuradhasharma"

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

# Native GitHub Pages build supports these plugins.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Don't process these files.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
