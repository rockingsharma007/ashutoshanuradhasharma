<footer class="footer">
  <div class="footer-inner">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. Written with care.</p>
    <nav class="footer-links" aria-label="Footer">
      {% for cat in site.data.categories %}
        <a href="{{ cat.slug | prepend: '/' | append: '/' | relative_url }}">{{ cat.name }}</a>
      {% endfor %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</footer>
