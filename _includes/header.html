<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav-links" aria-label="Primary">
      {% for cat in site.data.categories %}
        <a href="{{ cat.slug | prepend: '/' | append: '/' | relative_url }}">{{ cat.name }}</a>
      {% endfor %}
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
      <span class="theme-toggle-dot"></span>
    </button>
  </div>
</header>
